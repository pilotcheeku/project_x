    <title>SportSphere | FAQ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container">
        <a class="logo" href="index.html">SportSphere</a>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">Home</a></li>
          <li><a href="products.html">Catalog</a></li>

    <main class="section container">
      <h1>Frequently Asked Questions</h1>
      <div class="faq-list">
        <div class="faq-item">
          <button class="faq-question">How long does delivery take?</button>
          <div class="faq-answer">
            <p>Orders are delivered across India in 3-7 business days.</p>
          </div>
        </div>
        <div class="faq-item">
          <button class="faq-question">What is your return policy?</button>
          <div class="faq-answer">
            <p>Returns are accepted within 7 days for unused products with packaging.</p>
          </div>
        </div>
        <div class="faq-item">
          <button class="faq-question">What payment methods do you accept?</button>
          <div class="faq-answer">
            <p>We accept UPI, debit/credit cards, net banking, and wallets.</p>
          </div>
        </div>
      </div>
    </main>

    <script src="app.js"></script>
